[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "planogram3d"
version = "1.1.0"
description = "3D-визуализация планограмм магазина: состояние продаж, утверждённая планограмма, проверка регламента и контрактов с поставщиками"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["plotly>=5.0"]

[project.optional-dependencies]
web = ["flask>=2.0"]

[project.scripts]
planogram3d = "planogram3d.app:main"
planogram3d-web = "planogram3d.webapp.server:main"

[tool.setuptools]
packages = ["planogram3d", "planogram3d.core", "planogram3d.webapp",
            "planogram3d.webapp.tools", "planogram3d.robloxkit"]

[tool.setuptools.package-data]
"planogram3d.webapp" = ["templates/*.html", "static/vendor/*",
                        "static/data/*"]

[tool.setuptools.package-dir]
planogram3d = "."
