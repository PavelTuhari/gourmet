<!-- Переключатель языка интерфейса (ru/ro/en) — общий для всех экранов.
     Ссылки серверные (?lang=xx, страница перечитывается на новом языке —
     эмуляция сети живёт в StoreNetwork/DeliveryHub на сервере, поэтому
     "перезагрузка" не роняет состояние мира, только перерисовывает
     текущий кадр); localStorage запоминает выбор для последующих
     переходов по ссылкам без ?lang= (см. скрипт ниже). -->
<style>
  .langbar { position:fixed; top:8px; right:8px; z-index:9999;
             display:flex; gap:2px; background:rgba(20,28,38,.82);
             border-radius:8px; padding:3px;
             font:600 11px/1 'Segoe UI',system-ui,sans-serif;
             box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .langbar a { color:#c7d3e0; text-decoration:none; padding:5px 8px;
               border-radius:6px; }
  .langbar a.on { background:#2f6fed; color:#fff; }
  .langbar a:not(.on):hover { background:rgba(255,255,255,.14); }
</style>
<div class="langbar">
  {% for code, label in [('ru','RU'), ('ro','RO'), ('en','EN')] %}
  <a href="?lang={{ code }}" class="{{ 'on' if lang == code else '' }}"
     onclick="localStorage.setItem('planogram3d_lang','{{ code }}')"
     >{{ label }}</a>
  {% endfor %}
</div>
<script>
// если в адресе нет ?lang=, а в localStorage сохранён другой язык —
// переходим на него один раз, до отрисовки контента (не мигаем языком)
(function () {
  var url = new URL(location.href);
  if (!url.searchParams.get('lang')) {
    var stored = localStorage.getItem('planogram3d_lang');
    if (stored && stored !== '{{ lang }}') {
      url.searchParams.set('lang', stored);
      location.replace(url.toString());
    }
  }
})();
</script>
